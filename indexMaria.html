
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie-edge" />
    <link rel="manifest" href="./public/manifest.json">
    <link rel="shortcut icon" href="./public/favicon.ico"><!--time_left_txt/>-->
    <title>Novinha Quiz</title>
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body id="page-home">
    <div id="loader"></div>
    <!-- start Quiz button -->
    <div class="start_btn">
      <button class="btn" id="button_play">Comecar</button>
      <a class="btn" id="button_score" href=""
        >   </a
      >
    </div>

    <!-- Info Box -->
    <div class="info_box">
      
      <div class="info-title"><span>Regras</span> </div>
      
      <div class="info-list">
        <div class="info">
          1. Me amar.
        </div>
        
      </div>
      <div class="buttons">
        <button class="quit"  href="" > </button>
        <button class="restart">Seguir</button>
      </div>
    </div>
    <!-- Quiz Box -->
    <div class="quiz_box">
      <header>
        <div class="title">Novinha Quiz</div>
        <div class="timer">
          <div class="time_left_txt">Seja rápida!</div>
          <div class="timer_sec">10</div>
        </div>
        <div class="time_line"></div>
      </header>
      <section>
        <div class="que_text">
          <!-- Here I've inserted question from JavaScript -->
        </div>
        <div class="option_list">
          <!-- Here I've inserted options from JavaScript -->
        </div>
      </section>
      <!-- footer of Quiz Box -->
      <footer>
        <div class="total_que">
          <!-- Here I've inserted Question Count Number from JavaScript -->
        </div>
        <div id="hud-item">
          <p class="hud-prefix"> Puntos <span class="hud-main-text" id="score">0</span></p>
        </div>
        <button class="next_btn">Seguir</button>
      </footer>
    </div>
    <!-- Result Box -->
    <div class="result_box">
      <div class="icon">
        <i class="fas fa-crown"></i>
      </div>
      <div class="complete_text"></div>
      <div class="score_text">
        <!-- Here I've inserted Score Result from JavaScript -->
      </div>
      <div class="buttons">
        <button class="restart"  href="https://www.youtube.com/watch?v=XiQcobvSQzE" >Clica aqui </button>
        <button class="quit"  href="https://www.youtube.com/watch?v=XiQcobvSQzE" > Restart</button>
      </div>
    </div>
    <!-- Inside this JavaScript file I've inserted Questions and Options only -->
    <script src="./src/data/questions.js"></script>
    <!-- Inside this JavaScript file I've coded all Quiz Codes -->
    <script src="./src/javascript/index.js"></script>
  </body>
</html>
